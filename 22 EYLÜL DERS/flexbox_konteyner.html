<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox Container Laboratuarı</title>
    <style>
        *,
        *::before
        *::after{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        .chip-container{
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
        }
        .chip{
            background: white;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgb(87, 51, 7);
            font-size: 14px;
            font-weight: 500;
            color: darkslategray;
        }
    </style>
</head>
<body>
    <h2>Mobil filtre (flex-wrap + gap)</h2>
    <div class="chip-container">
        <div class="chip">Akıllı Telefon</div>
        <div class="chip">Bilgisayar</div>
        <div class="chip">Kulaklık</div>
        <div class="chip">Akıllı Saat</div>
        <div class="chip">Oyun Konsolu</div>
        <div class="chip">Aksesuar</div>
    </div>

    <h2>Navigasyon barı (space-between + align-items)</h2>
    <div class="card-header">
        <div>
            <h3 style="font-size: 16px;">Kullanıcı Profili</h3>
            <p style="color: #64748b; font-size: 13px;">Son giriş:Bugün 12:44</p>
        </div>
        <button style="background: #4f46e5; color: white; border: none; padding: 8px 14px; border-radius: 8px;">
            Düzenle
        </button>
    </div>
</body>
</html>
