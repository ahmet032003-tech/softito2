<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ccs pozizyonlama mimarisi</title>
    <style>
        *,*::before,*::after{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: black;
            color: white;
            padding-bottom: 80px;
        }
        /*Sticky mobil başlık*/
        .mobile-header{
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            padding: 16px 20px;
            border-bottom: 1px solid goldenrod;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <header class="mobile-header">keşfet & alışveriş yap</header>

    <main class="feed">
        <div class="product-card">
            <span class="badge-discount">%40 indirim</span>
            <h3>kablosuz kulaklık</h3>
            <p style="color: #94a3b8;margin: 8px 0 16px;">Aktif gürültü engelleme & 100 Saat pil ömrü</p>
<strong style="color: #38bdf8; font-size: 20px;">1.500 ₺</strong>
        </div>
    </main>
</body>
</html>
